<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aqua Luan — Bodega</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0a4d4a">
<link rel="icon" href="https://aqualuanpedidos.elhyai.com/logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#12324a; --teal:#0a7c6e; --teal2:#0a4d4a; --bg:#e9eff3; --card:#fff;
  --text:#12324a; --muted:#6b7f8e; --line:#dbe4ea; --soft:#f4f8fa;
  --red:#c0392b; --redbg:#fdecea; --amber:#b45309; --amberbg:#fef3c7; --okbg:#d1fae5; --ok:#047857;
  /* Color de cada etapa */
  --e1:#0369a1; --e1bg:#e0f2fe;   /* 1 Recepción */
  --e2:#b45309; --e2bg:#fef3c7;   /* 2 Producción */
  --e3:#047857; --e3bg:#d1fae5;   /* 3 Producto terminado */
  --e4:#4338ca; --e4bg:#e0e7ff;   /* 4 Carga al camión */
  --e5:#0f766e; --e5bg:#ccfbf1;   /* Devolución camión */
  --ed:#b91c1c; --edbg:#fee2e2;   /* Daños */
  --ea:#6b21a8; --eabg:#f3e8ff;   /* Ajuste */
  --ev:#0e7490; --evbg:#cffafe;   /* Envases prestados */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--text);min-height:100vh;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit}
.hidden{display:none!important}

/* ── Login ── */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(160deg,#0a4d4a,#12324a)}
.login-card{width:100%;max-width:380px;background:#fff;border-radius:20px;padding:28px 22px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.login-card img{display:block;height:54px;margin:0 auto 10px}
.login-card h1{text-align:center;font-size:20px}
.login-card p.sub{text-align:center;color:var(--muted);font-size:13px;margin:4px 0 18px}

/* ── Layout ── */
header.top{position:sticky;top:0;z-index:30;background:var(--teal2);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 0}
.top-row{display:flex;align-items:center;gap:10px;max-width:1100px;margin:0 auto}
.top-row img{height:30px;background:#fff;border-radius:8px;padding:3px}
.top-row .t{flex:1;min-width:0}
.top-row .t b{display:block;font-size:15px}
.top-row .t span{display:block;font-size:11px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.net{font-size:10px;font-weight:800;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.18)}
.net.off{background:#f59e0b;color:#3b2500}
.icon-btn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:7px 10px;font-weight:700;font-size:12px;cursor:pointer}
nav.tabs{display:flex;gap:6px;overflow-x:auto;max-width:1100px;margin:10px auto 0;padding-bottom:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;border:0;border-radius:99px;padding:8px 13px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.12);color:#e6f2f1;cursor:pointer;white-space:nowrap}
nav.tabs button.on{background:#fff;color:var(--teal2)}
main{max-width:1100px;margin:0 auto;padding:14px 14px 90px}

/* ── Componentes ── */
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 12px rgba(18,50,74,.06);margin-bottom:12px}
.card h2{font-size:16px;margin-bottom:4px}
.card .hint{font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.4}
.step-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.step-num{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex:0 0 auto}
.step-head h2{margin:0}
.step-head p{font-size:12.5px;color:var(--muted);margin-top:2px}
label.lbl{display:block;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:10px 0 5px}
input.in,select.in,textarea.in{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;font-size:15px;font-weight:600;color:var(--text);background:var(--soft)}
input.in:focus,select.in:focus,textarea.in:focus{outline:none;border-color:var(--teal);background:#fff}
textarea.in{min-height:70px;resize:vertical}
.grid2{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-main{background:var(--teal);color:#fff}
.btn-navy{background:var(--navy);color:#fff}
.btn-out{background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn-red{background:var(--red);color:#fff}
.btn-sm{padding:7px 11px;font-size:12px;border-radius:9px}
.btn-block{width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:800;white-space:nowrap}
.msg{padding:10px 12px;border-radius:11px;font-size:13px;font-weight:600;margin:8px 0;line-height:1.4}
.msg.err{background:var(--redbg);color:#991b1b}
.msg.ok{background:var(--okbg);color:#065f46}
.msg.warn{background:var(--amberbg);color:#92400e}
.msg.info{background:#e0f2fe;color:#075985}
.seg{display:flex;background:var(--soft);border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:800;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 4px rgba(0,0,0,.08)}

/* ── Lista de ítems con cantidades ── */
.picker-search{margin-bottom:8px}
.cat{margin-top:10px}
.cat-title{font-size:11px;font-weight:800;letter-spacing:.08em;color:#fff;background:var(--navy);border-radius:8px;padding:6px 10px;margin-bottom:4px;display:flex;justify-content:space-between}
.item{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{flex:1;min-width:0;font-weight:700;font-size:14px}
.item .nm small{display:block;font-weight:600;font-size:11.5px;color:var(--muted)}
.item .nm small.low{color:var(--red)}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:34px;height:38px;border:1.5px solid var(--line);background:#fff;border-radius:9px;font-size:18px;font-weight:800;color:var(--navy);cursor:pointer}
.qty input{width:66px;height:38px;text-align:center;border:1.5px solid var(--line);border-radius:9px;font-size:16px;font-weight:800;color:var(--text);background:var(--soft)}
.qty input.has{border-color:var(--teal);background:#e6f4f2}
.qty input.over{border-color:var(--red);background:var(--redbg)}
.sticky-save{position:sticky;bottom:10px;margin-top:12px;background:#fff;border-radius:14px;padding:10px;box-shadow:0 6px 24px rgba(18,50,74,.18);display:flex;align-items:center;gap:10px}
.sticky-save .sum{flex:1;font-size:12.5px;color:var(--muted);font-weight:600}
.sticky-save .sum b{color:var(--text);font-size:16px}

/* ── KPIs y tablas ── */
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));margin-bottom:12px}
.kpi{background:#fff;border-radius:14px;padding:12px 14px;box-shadow:0 2px 12px rgba(18,50,74,.06);border-left:4px solid var(--teal)}
.kpi span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.kpi b{display:block;font-size:24px;line-height:1.15;margin-top:2px}
.kpi small{font-size:11px;color:var(--muted);font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:7px 6px;background:var(--soft)}
.tbl td{padding:8px 6px;border-top:1px solid var(--line)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.low td{background:#fff5f5}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}

/* ── Historial ── */
.mov{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:#fff}
.mov.anulado{opacity:.55;background:#fafafa}
.mov-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mov-top .when{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700}
.mov-meta{font-size:12.5px;color:var(--muted);margin:6px 0;line-height:1.45}
.mov-meta b{color:var(--text)}
.mov-items{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700}
.pend{font-size:11px;font-weight:800;color:var(--amber)}

/* ── Modal ── */
.overlay{position:fixed;inset:0;background:rgba(10,30,45,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:640px){.overlay{align-items:center}}
.modal{background:#fff;width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media(min-width:640px){.modal{border-radius:20px}}
.modal h3{font-size:17px;margin-bottom:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 16px;border-radius:12px;font-weight:700;font-size:13.5px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:92vw;text-align:center}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:13.5px}
.quick{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.quick button{border:0;border-radius:14px;padding:14px;text-align:left;cursor:pointer;font-weight:800;font-size:14px}
.quick button small{display:block;font-weight:600;font-size:11.5px;opacity:.8;margin-top:3px}
.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;font-weight:800}
.flow .arrow{color:var(--muted)}
.user-row{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.roles{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.roles label{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:6px 9px;cursor:pointer}
</style>
</head>
<body>

<!-- ═════════ LOGIN ═════════ -->
<section id="login">
  <div class="login-card">
    <img src="./logo-luanaqua.png" alt="Aqua Luan" onerror="this.style.display='none'">
    <h1>Bodega Aqua Luan</h1>
    <p class="sub">Recepción · Producción · Producto terminado · Carga</p>
    <div id="loginMsg" class="msg err hidden"></div>
    <label class="lbl" for="loginUser">Usuario</label>
    <input class="in" id="loginUser" autocomplete="username" autocapitalize="none" placeholder="ej. recepcion">
    <label class="lbl" for="loginPass">Contraseña</label>
    <input class="in" id="loginPass" type="password" autocomplete="current-password">
    <button class="btn btn-main btn-block" id="btnLogin" style="margin-top:16px">Ingresar</button>
  </div>
</section>

<!-- ═════════ APP ═════════ -->
<section id="app" class="hidden">
  <header class="top">
    <div class="top-row">
      <img src="https://aqualuanpedidos.elhyai.com/logo-icon.png" alt="" onerror="this.style.display='none'">
      <div class="t"><b>Bodega Aqua Luan</b><span id="whoami"></span></div>
      <span class="net" id="netBadge">EN LÍNEA</span>
      <button class="icon-btn" id="btnLogout">Salir</button>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main id="main"></main>
</section>

<div id="modalRoot"></div>

<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-app-compat.js" integrity="sha384-tgDxKHbfk8o2rrXLSytbpDGsGk0bdZehHXoeD7LhuGriE89B5ovitrlBu7FX4kj/" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-auth-compat.js" integrity="sha384-UaGuhpArNP+gULAiiQrJNwk1AWTIZsfFEygQkDQYIGsTjoBmbSXgWfQeFJJXuFub" crossorigin="anonymous"></script>
<script src="https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore-compat.js" integrity="sha384-O2tgK2bVAUCyEX//gu7nH2z8A92RsaKhRAQABpJ7kLaF/4KQYEltHstFCV7nxWpr" crossorigin="anonymous"></script>
<script src="./app.js?v=3.1.4"></script>
</body>
</html>
